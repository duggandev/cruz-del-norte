events {}

http {
    server {
        listen 8080;
        server_name _;
        client_max_body_size 10m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        location = /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        location /api/v1/viajes/ {
            proxy_pass http://sc01-viajes:8081;
        }

        location /api/v1/reservas {
            proxy_pass http://sc02-reservas:8082;
        }

        location /api/v1/pasajeros/ {
            proxy_pass http://sc03-pasajeros:8083;
        }

        location /api/v1/pagos {
            proxy_pass http://sc04-pagos:8084;
        }

        location /api/v1/pasajes {
            proxy_pass http://sc05-pasajes:8085;
        }

        location /api/v1/programaciones {
            proxy_pass http://sc06-mantenimiento:8086;
        }

        location /documentos/ {
            proxy_pass http://sc05-pasajes:8085;
        }

        location = /openapi/sc01.json { proxy_pass http://sc01-viajes:8081/openapi.json; }
        location = /openapi/sc02.json { proxy_pass http://sc02-reservas:8082/openapi.json; }
        location = /openapi/sc03.json { proxy_pass http://sc03-pasajeros:8083/openapi.json; }
        location = /openapi/sc04.json { proxy_pass http://sc04-pagos:8084/openapi.json; }
        location = /openapi/sc05.json { proxy_pass http://sc05-pasajes:8085/openapi.json; }
        location = /openapi/sc06.json { proxy_pass http://sc06-mantenimiento:8086/openapi.json; }

        location / {
            add_header Content-Type application/json;
            return 200 '{"sistema":"Cruz del Norte","servicios":"SC-01 a SC-06","estado":"operativo"}';
        }
    }
}
