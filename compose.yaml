x-common-env: &common-env
  APP_ENV: ${APP_ENV:-academic_demo}
  DATABASE_URL: postgresql+psycopg://cruz:${POSTGRES_PASSWORD:-cruz_dev_password}@postgres:5432/cruz_del_norte
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SERVICE_PASSWORD_64_JWTSECRET}}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
  PUBLIC_PASAJES_URL: ${PUBLIC_PASAJES_URL:-${SERVICE_URL_GATEWAY_8080}/documentos}
  STORAGE_PASAJES_PATH: /app/storage/pasajes
  RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-25}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4200,http://127.0.0.1:8080,http://178.105.247.228:8000,https://appcruzdelnorte.duckdns.org}

x-service-common: &service-common
  build: .
  restart: unless-stopped
  volumes:
    - cruz_data:/app/data
  networks:
    - cruz_backend
  depends_on:
    seed:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cruz_del_norte
      POSTGRES_USER: cruz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cruz_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cruz_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cruz -d cruz_del_norte"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *common-env
    volumes:
      - cruz_data:/app/data
    networks:
      - cruz_backend
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ["sh", "-c", "python scripts/seed_dev.py && python scripts/seed_bulk.py"]
    restart: "no"
    environment: *common-env
    volumes:
      - cruz_data:/app/data
      - pasajes_storage:/app/storage/pasajes
    networks:
      - cruz_backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  sc01-viajes:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc01_viajes.main:app
      SERVICE_PORT: "8081"
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sc02-reservas:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc02_reservas.main:app
      SERVICE_PORT: "8082"
    expose: ["8082"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sc03-pasajeros:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc03_pasajeros.main:app
      SERVICE_PORT: "8083"
    expose: ["8083"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sc04-pagos:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc04_pagos.main:app
      SERVICE_PORT: "8084"
    expose: ["8084"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sc05-pasajes:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc05_pasajes.main:app
      SERVICE_PORT: "8085"
    volumes:
      - cruz_data:/app/data
      - pasajes_storage:/app/storage/pasajes
    expose: ["8085"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sc06-mantenimiento:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc06_mantenimiento.main:app
      SERVICE_PORT: "8086"
    expose: ["8086"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    <<: *service-common
    environment:
      <<: *common-env
      SERVICE_MODULE: app.sc00_auth.main:app
      SERVICE_PORT: "8087"
    expose: ["8087"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      SERVICE_URL_GATEWAY_8080: /
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cruz_backend
    expose: ["8080"]
    depends_on:
      sc01-viajes:
        condition: service_healthy
      sc02-reservas:
        condition: service_healthy
      sc03-pasajeros:
        condition: service_healthy
      sc04-pagos:
        condition: service_healthy
      sc05-pasajes:
        condition: service_healthy
      sc06-mantenimiento:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  cruz_backend:

volumes:
  postgres_data:
  cruz_data:
  pasajes_storage:
